name: Gateway CI

on:
  push:
    paths:
      - ".github/workflows/gateway-ci.yml"
      - "greenmind-gateway/**"
  pull_request:
    paths:
      - ".github/workflows/gateway-ci.yml"
      - "greenmind-gateway/**"

permissions:
  contents: read

jobs:
  verify-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: greenmind-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install hashed production dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Validate installer shell syntax
        run: bash -n install-gateway.sh
